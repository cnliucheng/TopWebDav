<!-- AI生成 -->
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TopWebDav</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<p data-aigc-mark="1" style="margin:0 0 8px;font-size:10px;line-height:1.3;color:#6b6560;font-weight:400;">AI生成</p>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div class="brand-text">
          <strong>TopWebDav</strong>
          <span>文件管理</span>
        </div>
      </div>
      <div class="top-actions">
        <button id="btnPassword" type="button" class="btn ghost">改密码</button>
        <button id="btnLogout" type="button" class="btn ghost">退出</button>
      </div>
    </header>

    <div id="error" class="error" hidden></div>

    <section class="toolbar card">
      <div class="crumbs">
        <button id="btnUp" type="button" class="btn icon" title="上级目录" aria-label="上级目录">↑</button>
        <nav id="pathLabel" class="crumb-path" aria-label="当前路径">/</nav>
      </div>
      <div class="tools">
        <button id="btnRefresh" type="button" class="btn">刷新</button>
        <button id="btnMkdir" type="button" class="btn">新建文件夹</button>
        <button id="btnCreate" type="button" class="btn">新建文件</button>
        <button id="btnUpload" type="button" class="btn primary">上传</button>
      </div>
    </section>

    <section class="panel card">
      <table id="listing">
        <thead>
          <tr>
            <th>名称</th>
            <th class="col-size">大小</th>
            <th class="col-time">修改时间</th>
            <th class="col-act">操作</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="emptyState" class="empty" hidden>
        <div class="empty-icon" aria-hidden="true"></div>
        <p class="empty-title">这个目录是空的</p>
        <p class="empty-sub">上传文件，或新建一个文件夹开始整理</p>
      </div>
    </section>
  </div>

  <input id="fileInput" type="file" multiple hidden />

  <dialog id="dlgEdit" class="dlg">
    <form method="dialog" class="dlg-form">
      <h2 id="editTitle">编辑</h2>
      <textarea id="editBody" rows="16" spellcheck="false"></textarea>
      <div class="dlg-actions">
        <button id="editCancel" type="button" class="btn">取消</button>
        <button id="editSave" type="button" class="btn primary">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlgPrompt" class="dlg">
    <form method="dialog" class="dlg-form">
      <h2 id="promptTitle">输入</h2>
      <label class="field">
        <span>内容</span>
        <input id="promptValue" type="text" autocomplete="off" />
        <input id="promptSecret" type="password" autocomplete="off" hidden />
      </label>
      <div class="dlg-actions">
        <button id="promptCancel" type="button" class="btn">取消</button>
        <button id="promptOk" type="button" class="btn primary">确定</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlgCreate" class="dlg">
    <form method="dialog" class="dlg-form">
      <h2>新建文件</h2>
      <label class="field">
        <span>文件名</span>
        <input id="createName" type="text" placeholder="例如 notes.txt" autocomplete="off" />
      </label>
      <label class="field">
        <span>内容</span>
        <textarea id="createBody" rows="14" spellcheck="false" placeholder="可留空"></textarea>
      </label>
      <div class="dlg-actions">
        <button id="createCancel" type="button" class="btn">取消</button>
        <button id="createSave" type="button" class="btn primary">创建</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlgPassword" class="dlg">
    <form method="dialog" class="dlg-form">
      <h2>修改密码</h2>
      <label class="field">
        <span>旧密码</span>
        <input id="oldPw" type="password" autocomplete="current-password" />
      </label>
      <label class="field">
        <span>新密码</span>
        <input id="newPw" type="password" autocomplete="new-password" />
      </label>
      <div class="dlg-actions">
        <button id="pwCancel" type="button" class="btn">取消</button>
        <button id="pwSave" type="button" class="btn primary">保存</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
